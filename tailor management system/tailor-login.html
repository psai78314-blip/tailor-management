<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tailor Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(to right,#141e30,#243b55);
}

.login-box{
    width:400px;
    background:white;
    padding:40px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
}

.login-box h1{
    text-align:center;
    margin-bottom:30px;
    color:#ff9800;
}

.input-box{
    margin-bottom:20px;
}

.input-box label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

.input-box input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
}

.btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#ff9800;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.btn:hover{
    background:#e68900;
}

#message{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

.demo{
    margin-top:25px;
    background:#f4f4f4;
    padding:15px;
    border-radius:10px;
}

</style>
</head>

<body>

<div class="login-box">

    <h1>Tailor Login</h1>

    <form id="loginForm">

        <div class="input-box">
            <label>Tailor ID</label>
            <input type="text" id="tailorId" required>
        </div>

        <div class="input-box">
            <label>Password</label>
            <input type="password" id="password" required>
        </div>

        <button type="submit" class="btn">
            Login
        </button>

    </form>

    <div id="message"></div>

    <div class="demo">
        <h3>Demo Login</h3>
        <p><b>Tailor ID:</b> tailor101</p>
        <p><b>Password:</b> tailor123</p>
    </div>

</div>

<script>

document.getElementById("loginForm")
.addEventListener("submit", function(event){

    event.preventDefault();

    let tailorId =
    document.getElementById("tailorId").value;

    let password =
    document.getElementById("password").value;

    let message =
    document.getElementById("message");

    if(tailorId === "tailor101" &&
       password === "tailor123")
    {
        message.style.color = "green";
        message.innerHTML = "Login Successful";

        setTimeout(function(){

            window.location.href =
            "tailor-dashboard.html";

        },1000);
    }
    else
    {
        message.style.color = "red";
        message.innerHTML =
        "Invalid Tailor ID or Password";
    }

});

</script>

</body>
</html>
